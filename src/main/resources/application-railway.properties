# Cloud (Railway) profile overrides.
#
# On Railway the TLS/HTTPS cert is handled by the Caddy reverse-proxy service
# in front of this app, not by this app itself. That's why SSL is disabled
# here and the app just listens on plain HTTP on whatever port Railway
# assigns via $PORT. The self-signed keystore / port 8443 setup in
# application.properties is left untouched for local running and grading.
#
# server.servlet.context-path mounts the whole app under /ssl-demo so it can
# live at erikhays.dev/ssl-demo instead of the domain root, since the Caddy
# proxy routes that one path prefix here and everything else to the
# portfolio site.

server.port=${PORT:8443}
server.ssl.enabled=false
server.servlet.context-path=/ssl-demo
